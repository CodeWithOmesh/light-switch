<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Switch Dark Mode</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --amber:#ffb547; --amber-deep:#f29a1f; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    --bg:#0e0d10; --text:#ece8ee; --muted:#8d8792; --card:#17161a; --line:#2a282e; --chip:#1f1d23;
    font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;overflow-x:hidden;
    transition:background .45s ease, color .45s ease;
  }
  body.lights-on{
    --bg:#f6efe2; --text:#231c12; --muted:#6f6455; --card:#fffaf1; --line:#e6dac4; --chip:#f1e6d1; --amber-deep:#9a560a;
  }
  /* warm ceiling glow */
  .glow{
    position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease;
    background:radial-gradient(ellipse 70% 55% at 50% -5%, rgba(255,181,71,.55), rgba(255,181,71,.12) 45%, transparent 75%);
  }
  body.lights-on .glow{opacity:1;animation:warm .5s ease-out 1}
  @keyframes warm{0%{opacity:0}18%{opacity:.75}26%{opacity:.35}45%{opacity:1}100%{opacity:1}}

  .scene{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:clamp(28px,7vw,110px);padding:40px 20px;flex-wrap:wrap}

  /* ---------- wall switch ---------- */
  .plate{
    position:relative;width:150px;height:236px;border-radius:18px;flex:none;
    background:linear-gradient(160deg,#34323a,#1e1d22);
    box-shadow:0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
    transition:background .45s ease, box-shadow .45s ease;
  }
  body.lights-on .plate{
    background:linear-gradient(160deg,#fffdf8,#ece2cf);
    box-shadow:0 20px 40px rgba(120,80,20,.22), inset 0 1px 0 #fff, inset 0 -2px 0 rgba(120,90,40,.15);
  }
  .screw{position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#6b6670,#2b292e);transition:background .45s}
  .screw:after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:rgba(0,0,0,.45);transform:rotate(35deg)}
  .screw.t{top:16px}.screw.b{bottom:16px}
  body.lights-on .screw{background:radial-gradient(circle at 35% 35%,#fff,#cbbd9f)}

  .switch{
    position:relative;width:64px;height:112px;border:0;border-radius:12px;cursor:pointer;padding:0;
    background:#121114;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);
    perspective:320px;outline:none;transition:background .45s, box-shadow .45s;
    -webkit-tap-highlight-color:transparent;
  }
  body.lights-on .switch{background:#d9ccb2;box-shadow:inset 0 2px 6px rgba(110,80,30,.35)}
  .switch:focus-visible{box-shadow:0 0 0 3px var(--amber), inset 0 2px 6px rgba(0,0,0,.7)}
  .rocker{
    position:absolute;inset:6px;border-radius:9px;
    background:linear-gradient(180deg,#2f2d33 0%,#232126 50%,#3a383e 100%);
    transform:rotateX(16deg);transform-origin:50% 50%;
    transition:transform .14s cubic-bezier(.3,1.6,.5,1), background .45s;
    box-shadow:0 6px 0 #0b0a0c, 0 8px 10px rgba(0,0,0,.45);
  }
  body.lights-on .rocker{
    transform:rotateX(-16deg);
    background:linear-gradient(180deg,#fffefb 0%,#f3ebdc 50%,#fffaf1 100%);
    box-shadow:0 -6px 0 #cdbf9f, 0 -2px 10px rgba(110,80,30,.25);
  }
  .rocker:before{ /* centre seam */
    content:"";position:absolute;left:10px;right:10px;top:50%;height:1px;background:rgba(255,255,255,.07)}
  body.lights-on .rocker:before{background:rgba(120,90,40,.15)}
  /* little locator light so you can find it in the dark */
  .led{position:absolute;left:50%;bottom:40px;width:7px;height:7px;margin-left:-4px;border-radius:50%;
    background:var(--amber);box-shadow:0 0 14px 4px rgba(255,181,71,.85);transition:opacity .3s}
  body.lights-on .led{opacity:0}
  .hint{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:18px;white-space:nowrap;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:opacity .4s}
  body.lights-on .hint{opacity:0}

  /* ---------- sample website ---------- */
  .site{
    width:min(440px,92vw);border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);
    box-shadow:0 30px 60px rgba(0,0,0,.35);
    transition:background .45s, border-color .45s, box-shadow .45s;
  }
  body.lights-on .site{box-shadow:0 30px 60px rgba(120,80,20,.18)}
  .bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line);transition:border-color .45s}
  .bar i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .45s}
  body.lights-on .bar i:nth-child(1){background:#ff5f57}
  body.lights-on .bar i:nth-child(2){background:#febc2e}
  body.lights-on .bar i:nth-child(3){background:#28c840}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 0;font-size:13px}
  .logo{font-weight:600;display:flex;align-items:center;gap:8px}
  .logo span{width:16px;height:16px;border-radius:5px;background:var(--amber)}
  .links{display:flex;gap:16px;color:var(--muted)}
  .hero{padding:34px 24px 28px}
  .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--amber-deep);background:var(--chip);padding:6px 10px;border-radius:999px;transition:background .45s}
  h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:42px;line-height:1.05;margin-top:16px}
  .hero p{color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:12px;max-width:34ch;transition:color .45s}
  .cta{display:flex;gap:10px;margin-top:22px}
  .btn{border:0;border-radius:10px;padding:12px 18px;font:600 13.5px Inter,sans-serif;cursor:pointer}
  .btn.primary{background:var(--amber);color:#1a1206}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);transition:color .45s,border-color .45s}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 24px 24px}
  .tile{height:74px;border-radius:12px;background:var(--chip);transition:background .45s;position:relative;overflow:hidden}
  .tile:after{content:"";position:absolute;left:12px;bottom:12px;width:40%;height:6px;border-radius:3px;background:var(--line);transition:background .45s}
  .tile.a{background:linear-gradient(135deg,rgba(255,181,71,.35),rgba(255,181,71,.05))}

  .sound{position:fixed;top:14px;right:14px;z-index:5;background:transparent;border:1px solid var(--line);
    color:var(--muted);border-radius:999px;padding:7px 12px;font:500 12px Inter,sans-serif;cursor:pointer}
  @media (max-width:760px){ .scene{flex-direction:column;gap:56px} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<button class="sound" id="soundBtn" aria-pressed="true">Sound: on</button>

<main class="scene">
  <div class="plate">
    <i class="screw t"></i>
    <button class="switch" id="switch" aria-pressed="false" aria-label="Light switch: toggle light mode">
      <span class="rocker"></span>
    </button>
    <i class="led"></i>
    <i class="screw b"></i>
    <div class="hint">Flip the switch</div>
  </div>

  <section class="site" aria-label="Sample website">
    <div class="bar"><i></i><i></i><i></i></div>
    <nav class="nav">
      <div class="logo"><span></span>Studio</div>
      <div class="links"><a>Work</a><a>About</a><a>Contact</a></div>
    </nav>
    <div class="hero">
      <span class="tag" id="tag">Dark mode</span>
      <h1 id="greet">Hello,<br>night owl.</h1>
      <p id="copy">It's quiet in here. Flip the switch to let some light in.</p>
      <div class="cta">
        <button class="btn primary">Get started</button>
        <button class="btn ghost">Learn more</button>
      </div>
    </div>
    <div class="tiles"><div class="tile a"></div><div class="tile"></div><div class="tile"></div></div>
  </section>
</main>

<script>
const switchEl = document.getElementById("switch");
const greet = document.getElementById("greet");
const copy = document.getElementById("copy");
const tag = document.getElementById("tag");
let audioCtx = null, soundOn = true;

function getCtx(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){ audioCtx = null; }
  return audioCtx;
}

// A wall switch makes two sounds: a soft press, then a sharp snap
function playClick(on){
  const ctx = getCtx(); if(!ctx || !soundOn) return;
  const t = ctx.currentTime;
  [[0, 0.25, 1400], [0.035, 0.6, on ? 3200 : 2200]].forEach(([delay, vol, freq]) => {
    const len = Math.floor(ctx.sampleRate * 0.025);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.value = vol;
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t + delay);
  });
}

switchEl.addEventListener("click", () => {
  const on = document.body.classList.toggle("lights-on");
  switchEl.setAttribute("aria-pressed", on);
  playClick(on);
  greet.innerHTML = on ? "Good<br>morning." : "Hello,<br>night owl.";
  copy.textContent = on ? "Lights on. Everything's easier to read now." : "It's quiet in here. Flip the switch to let some light in.";
  tag.textContent = on ? "Light mode" : "Dark mode";
});

document.getElementById("soundBtn").addEventListener("click", e => {
  soundOn = !soundOn;
  e.currentTarget.textContent = "Sound: " + (soundOn ? "on" : "off");
  e.currentTarget.setAttribute("aria-pressed", soundOn);
});
</script>
</body>
</html>
